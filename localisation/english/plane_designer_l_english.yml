 early_bombs:0 "Dumb Bombs"
 early_bombs_desc:0 "Bombs with no gps guidance, hope you're CCIP certified!"
 heavy_bombs:0 "GPS Guided Bombs"
 heavy_bombs_desc:0 "Turn your brain off and hold the pickle button, the plane does the rest!"
 armor_piercing_bombs:0 "Massive Ordnance Penetrators"
 armor_piercing_bombs_desc:0 "The Massive Ordnance Penetrator is, as the name implies, a massive GPS/INS guided bomb that specializes in eliminating underground facilities and reinforced structures."
 air_torpedoe_1:0 "ASSM-12"
 air_torpedoe_1_desc:0 "The ASSM-12, or the Anti Ship Surface (skirting) Missile, upon launch skirts the sea until it reaches it's target, it then pops up and hits the targeted ship."
 air_torpedoe_2:0 "ASSM-35"
 air_torpedoe_2_desc:0 "The ASSM-35, or the Anti Ship Surface (skirting) Missile, upon launch skirts the sea until it reaches it's target, it then pops up and hits the targeted ship."
 air_torpedoe_3:0 "ASSM-41"
 air_torpedoe_3_desc:0 "The ASSM-41, or the Anti Ship Surface (skirting) Missile, upon launch skirts the sea until it reaches it's target, it then pops up and hits the targeted ship."
 photo_reconnaisance:1 "AWACS Radome"
 photo_reconnaisance_desc:0 "Installed on medium or large airframes, this Radome turns a standard cargo or naval escort aircraft into a omniscient god (up to 200nm). It allows up to 500 active radar tracks, with instant airframe identification, classification and threat status."
 aa_lmg:0 "20mm Gatling Rotary Cannon"
 aa_lmg_desc:0 "It goes ZRRT not BRRT"
 survivability_studies:0 "Enhanced Sensor Suites"
 survivability_studies_desc:0 "Long gone are the days where our pilots had the use the mark 1 eyeball and hope they didn't shoot a friendly IFV, modern day sensor fusion and sensor suites allow our pilots to be aware of who they are targeting, where they are and what they are doing at all times."
 aircraft_construction:0 "Form Factors"
 aircraft_construction_desc:0 "Swing wings, delta wings, canards, forward sweep wings. We have it all!"
 targetting_pods:0 "Aircraft Pods"
 targetting_pods_desc:0 "Pods like the ARMTS pod, the MARKSPONY and LATERN pods, as well as full spectrum external jamming pods give our pilots enhanced situational awareness, survivability and lethality in the skies."
 aa_hmg:0 "25mm Gatling Rotary Cannon"

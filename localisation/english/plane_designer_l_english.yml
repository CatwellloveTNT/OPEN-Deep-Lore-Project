 medium_plane_airframe_0:0 "2010 Era Medium Airframe"
 medium_plane_airframe_0_desc:0 "canonically "medium airframes" as a concept is not widespread in OPEN, but heavy fighters are. click on the 2025 era medium airframes and higher if you want to see their lore blurb"
 medium_plane_airframe_1:0 "2025 Medium Airframe"
 medium_plane_airframe_1_desc:0 "Following the First Roadtrip War and the years of Coalition violations of Triste's airspace and borders, Triste opted to try to counter the Coalition dogfighting doctrine by creating what they dubbed the "EAION" series. Large, transonic, delta wing fighters which can hold up to 20 air to air missiles. The intent was to, upon a hostile radar contact, to run a constant grinder with a 4 ship element, ensuring the attacking force has to deal with 80 missiles before they were able to get into WVR."
 medium_plane_airframe_2:0 "2035 Medium Airframe"
 medium_plane_airframe_2_desc:0 "With varying levels of success countering the Coalition's EW and dogfighting tactics, Triste's EAION 2 seeked to go away with the delta wing design and instead focus holding its own against the Battymanzel in a dogfight once the grinder was broken. It has a forward swept wing design and is capable of holding 12 air to air missiles."
 medium_plane_airframe_3:0 "2040 Medium Airframe"
 medium_plane_airframe_3_desc:0 "Triste falls and the world deems the heavy fighter concept inferior to tactical light fighters"
 medium_plane_airframe_4:0 "2042 Medium Airframe"
 medium_plane_airframe_4_desc:0 "Triste falls and the world deems the heavy fighter concept inferior to tactical light fighters"

 floats_desc:0 ""
 flying_boat_medium:0 "Flying Boat"
 flying_boat_medium_desc:0 "Instead of mounting a landing gear, the underside of the plane can be shaped to be able to land on water. this makes scouting missions over water much easier."
 flying_boat_large:0 "$flying_boat_medium$"
 flying_boat_large_desc:0 "$flying_boat_medium_desc$"
 guided_anti_ship_missile:1 "Guided Anti-Ship Missile"
 guided_anti_ship_missile_desc:0 "Effectively an anti-ship bomb with a rocket engine and radio guidance, this new weapon of war is a serious threat to all ships currently afloat."
 bouncing_bomb_release: "Bouncing Bomb Release Mechanism"
 bouncing_bomb_release_desc: "A bomb rack for carrying and releasing special bouncing bombs, that skid across the water unitl they hit their targets. The mechanism sets the bomb spinning backwars during the release, making it more likely to reach its intented structural target."
 earthshaker_bomb_release: "Earthshaker Bomb Release Mechanism"
 earthshaker_bomb_release_desc: "A bomb rack and release mechanism for the gigantic earthshaker bombs that are designed to penetrate the ground on impact and explode underground, causing great structural damage to their target."
 rocket_propelled_bombs: "Rocket Propelled Bombs"
 rocket_propelled_bombs_desc: "Rocket propelled unguided bombs can inflict considerable damage on ships and similar armoured larger targets."
 improved_rocket_propelled_bombs: "Heavy Rocket Propelled Bombs"
 improved_rocket_propelled_bombs_desc: "Even larger rocket propelled unguided bombs, carrying a heavier payload, able to penetrate their targets even more effectively."

 fixed_explosive_charge:0 "Fixed Explosive Charge"
 fixed_explosive_charge_desc:0 "A fixed hollow charge turns the plane into a flying bomb. If the plane is steered into an enemy ship, it would cause dramatic destruction, but at the cost of the plane and the crew both being lost."
 recon_camera:0 "Recon Camera"
 recon_camera_desc:0 "A set of cameras with special lenses, allowing the plane to take accurate pictures of enemy formations and installations even from high altitude."
 airdropped_mines:0 "Airdropped Mines"
 airdropped_mines_desc:0 "A set of naval mines equipped with a parachute, which allows them to be dropped from a plane."
 demining_coil:0 "Demining Coil"
 demining_coil_desc:0 "A large coil mounted on the airframe allows the plane to project a powerful magentic field, which causes magnetic mines in its flightpath to explode."

 small_plane_airframe_0:0 "2010 Era Small Airframe"
 small_plane_airframe_0_desc:0 "The birth of what would be known today as "old world airframes" came about in 2010. The Coalition's revolutionary ATFB2 program demanded a stealthy multirole aircraft that could fight in all environments under the worst conditions and prevail in BVR and WVR. Safe to say the results of the program had the world following suit."
 small_plane_airframe_1:0 "2025 Era Small Airframe"
 small_plane_airframe_1_desc:0 "It's around the 2020s where a drastic doctrinal shift was noticed between the Big 3, Arcadia's research into EEAGR erodded the need to develop stealth aircraft, and as such each of the Big 3 focused on their primary strenghts. The Coalition closed the gap and focused on WVR, Arcadia focused on BVR at extreme ranges and Aviceyn still held on to the belief that stealth was superior."
 small_plane_airframe_2:0 "2035 Era Small Airframe"
 small_plane_airframe_2_desc:0 "By 2035 each of the big 3 had mastered their respective specialization and doctrine in the air. The Coalition had mastered energy conservation, thrust vectoring and WVR, Arcadia was second to none in terms of radar and BVR and Aviceyn was determined to bring stealth back to the forefront of a non-stealth world."
 small_plane_airframe_3:0 "2040 Era Small Airframe"
 small_plane_airframe_3_desc:0 "By 2040, The Big 3 were set on their war paths. The Coalition's SUKANKUWORKS projects had begun to bleed into its regular aircraft development, leading to the development of the SUPER series. Arcadia's Skieslabs development of the Eliptical Missile had revolutionized BVR combat and Aviceyn's stealth wingman drone swarms made both BVR and WVR a challenge to any opponent."
 small_plane_airframe_4:0 "2042 Era Small Airframe"
 small_plane_airframe_4_desc:0 "With the Great War in full swing, the Big 3 each opted for the creation of an ultimate multirole aircraft. The Coalition and Arcadia combined SUKANKUWORKS and Skieslabs to develop an aircraft that could perform exceptionally within both BVR and WVR situations, and Aviceyn's TMRSRD developed what they believe to be the fighter to beat all fighters."

 small_plane_airframe_5: "Supersonic Small Airframe"
 small_plane_airframe_5_desc: "This advanced airframe, capable of Mach 1 supersonic flight embodies the pinnacle of human engineering"

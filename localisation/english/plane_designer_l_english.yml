 colascp:0 "COLASCP"
 colascp_desc:0 "Used primarily by the Coalition States and her allies, this avionics suite assists the pilot in within visual range combat, offensive situational awareness and big-picture planning."

 skiesassist:0 "SKIESASSIST"
 skiesassist_desc:0 "Used exclusively by Arcadia, this avionics suite is designed to allow the pilot to focus on operational objectives rather than flying the aircraft, it provides automatic loitering waypoints, G-CAS and a ponytube connection on the right MFD."

 aicps:0 "AICPS"
 aicps_desc:0 "Considered a template by the big 3, this avionics suite provides jack-of-all-trades like assistance to pilots. While it does not specialize into any particular niche like the dedicated suites, when in doubt, choose AICPS."



 large_plane_airframe_0:0 "2010 Era Large Airframe"
 large_plane_airframe_0_desc:0 "With nuclear capable strategic bombers being widespread among the big 3, countermeasures against these bombers were many, which meant the bombers needed to be stealthy, high and fast if it wanted to have any chance at breaching enemy IADNs"
 large_plane_airframe_1:0 "2025 Large Airframe"
 large_plane_airframe_1_desc:0 "By 2025, the concept of the strategic bomber barely changed, these bombers have an optimized stealth design, four afterburning engines and a storage capacity for hundreds of small bombs, or tens of MOPs"
 large_plane_airframe_2:0 "2035 Large Airframe"
 large_plane_airframe_2_desc:0 "Yep... they are... still the same. just faster..."
 large_plane_airframe_3:0 "2040 Large Airframe"
 large_plane_airframe_3_desc:0 "VERY FAST. VERY STEALTH. MANY BOMBS. KILL ALL."
 large_plane_airframe_4:0 "2042 Large Airframe"
 large_plane_airframe_4_desc:0 "KILL. KILL. KILL. KILL. KILL. KILL. KILL. KILL. KILL. KILL. KILL. "
 large_plane_maritime_patrol_plane_airframe_0:0 "2010 Era Maritime Patrol Plane"
 large_plane_maritime_patrol_plane_airframe_0_desc:1 "The fleet needs long-ranged planes to find their enemies far from shore. While somewhat outdated, this airframe offers the necessary range to cover large stretches of ocean."
 large_plane_maritime_patrol_plane_airframe_1:0 "Basic Maritime Patrol Plane"
 large_plane_maritime_patrol_plane_airframe_1_desc:0 "The advent of more powerful carrier planes makes it necessary to find and destroy enemy fleets far from shore. The first step for this is to find them far out in the ocean, necessitating a new type of plane."
 large_plane_maritime_patrol_plane_airframe_2:0 "Improved Maritime Patrol Plane"
 large_plane_maritime_patrol_plane_airframe_2_desc:0 "The dual threat of submarines and raiding cruisers requires patrolling vast stretches of ocean. This airframe is optimized for this."
 large_plane_maritime_patrol_plane_airframe_3:0 "Advanced Maritime Patrol Plane"
 large_plane_maritime_patrol_plane_airframe_3_desc:0 "Radar and other sensors make it possible to find enemy fleets even in poor weather or dark nights, but all the new equipment requires a bigger airframe to carry it."
 large_plane_maritime_patrol_plane_airframe_4:0 "Modern Maritime Patrol Airframe"
 large_plane_maritime_patrol_plane_airframe_4_desc:0 "With the dawn of the missile age, maritime patrol planes must be capable of operating even further from shore, and for longer durations."
 cv_small_plane_airframe_0:0 "2010 Era Carrier Airframe"
 cv_small_plane_airframe_0_desc:0 "Used primarily by the Coalition States and Aviceyn, Old World carrier aircraft spent most of their lifetime doing fleet defense and HAVCAPS"
 cv_small_plane_airframe_1:0 "2025 Era Carrier Airframe"
 cv_small_plane_airframe_1_desc:0 "With the 2020 doctrinal split, the type of naval aircraft varied between the Coalition and Aviceyn. While Aviceyn would still develop aircraft specific to the navy, the Coalition shifted away from the concept of a unique naval aircraft entirely, altering their current land based designs into hybrid designs capable of launching off of the deck of a carrier or the strip of an airbase."
 cv_small_plane_airframe_2:0 "2035 Era Carrier Airframe"
 cv_small_plane_airframe_2_desc:0 "With the profileration of STOVL and the Coalition's increasingly intense integration of vernier thrusters into it's aircraft, by 2035 the Coalition States had begun to outpace Aviceyn in regards to carrier supremacy. With 8 Coalition carriers patrolling each part of the globe, Aviceyn began to fall back to the Titan Walls and the Srakin Sea."
 cv_small_plane_airframe_3:0 "2040 Era Carrier Airframe"
 cv_small_plane_airframe_3_desc:0 "yea bro not much has changed."
 cv_small_plane_airframe_4:0 "2042 Era Carrier Airframe"
 cv_small_plane_airframe_4_desc:0 "human supremacy!!!!!!!!!!!!!!!!!!!!!!!!!"

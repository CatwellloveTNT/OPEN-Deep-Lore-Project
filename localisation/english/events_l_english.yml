 arc.22.t: "Who Does Starail Choose?"
# ------------------------------- 02/20/26 this is the first event i ever wrote for OPEN, you can literally see me improving at writing as the event goes on lmao. i wonder how good i'll be by the end of this journey ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
 arc.22.d: "Starail paced in her room, she can't remember the last time she had to pace to clear her mind, but there she was, pacing in circles. She tried to recall the overly long briefings she had with Trigger, the late nights mapping out possible Aviceynian cells across Arcadia and the smiles she and him had to put on for the higher ups at Pangley, to her, those days felt as if they were from a previous life. Trigger has been alot of things since Starail knew him. A field partner, a close friend, a careerpony, a cartoon hobbiest. That one always made her laugh, a grown pony— an AESA field agent of all things being into cartoons? She couldn't believe it. But one thing always stuck out to her, Trigger always was a big advocate against Aviceyn. Even earlier today Trigger made sure to mention his stance against the Aviceynians if he ever became the director of AESA. He spoke as if it was guaranteed... About how when he's in charge he'll assist Trinidadian Foreign Intelligence crowncracker teams by deploying ALH initative agents to dig underneath the Titan walls and breach in from the ocean... "God dammit! Why'd it have to be those two." She said aloud, not realizing the door to her room had begun to creek open. \n\n"Queen's plight?" The purple pony said in an amusing, almost mocking tone. Starail smiled. "Monarch you piece of shit, y'know you gotta knock now." Monarch laughed and put her scarred right hoof on Starail's shoulder "Don't tell me you've been doing this pacing shit again." Monarch said in her typical unemotional voice. Starail looked at her in embarrassment, she really had lost track of time pacing around the room, hell, she didn't even know if she was speaking when she was pacing. But given Monarch's pitiful gaze, she probably was. "I just didn't think it would be this hard... y'know. It feels like, I would be trading in one friendship for another." Starail truly felt that in her heart, even in a position as important as the president, she couldn't bring herself to make the choice. "Not a good look being an indecisive leader, Stary. Everyone'll eat you alive if they ever sense that sort of weakness." Monarch stated with as much empathy as her cold tone of voice could carry. "Especially those dinosaurs in the War Council." Monarch stared directly into Starail's teal eyes and continued "Listen, I'm sure you've seen the shit going on around us. Anti-human and anti-First-World groups popping up faster than we can track. There's wars breaking out all over the continent..." Monarch sighed, and said in a softer tone of voice, "We're... We're not in the same world we grew up in, Stary. Aviceyn isn't the only threat anymore. We need to think about continential security." Starail averted her gaze from Monarch, what she was saying was true. But Trigger's ideas had merit. If only she could of had both of them be the director of AESA, she thought to herself. They perfected opposed each other in viewpoint. One for focusing on Aviceyn, and the other for focusing on Arcadia. After a brief moment, she stared back into Monarch's periwinkle eyes and said..."
 arc.22.a: "Alright Monarch... I choose you."
 arc.22.b: "I'm sorry Monarch... I'm going with Trigger."
 arc.23.t: "Satoru and Bell Recalled From Triste"
 arc.23.d: ""Nothing like that cold Arcadian air, huh Bell?" \n\nIt had been awhile since Satoru ever set foot on his home soil, so long in fact that the truly frigid Arcadian air made him nostalgic for his time before he was even called "Satoru". His involvement in Triste had changed him, and he would have to reacclimate to being back home. At least until the next operation. Bell rolled her eyes and laughed. To her, it felt strange being back in Arcadia... It felt almost wrong. "So, what shitshow do y'think happened this time" Bell said, her mask giving her voice an almost robotic accent. "I dunno." Satoru responded. "Not like Monarch gave much on the details... Maybe shes giving us a break?" Satoru spoke as if he was trying to give life to the idea that Monarch would give them a break, he was back in Arcadia after all and he hoped he could've spent some time with his family. "Ha! You're better off betting on humans growing wings and a tail." Bell quipped. Satoru gave a weary gaze to Bell, sighed and said..."    
 arc.23.a: "I just really want to see my sister..."
 arc.23.b: "I guess you're right."

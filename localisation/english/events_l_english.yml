 arc.30.t: "Whispers From Beyond The Walls..."
 arc.30.d: ""Are you getting my calls? I need to tell you something. Don't pull your secret special on me Starail, this is important!"\n\n At this point in her career, Starail was used to these types of voice messages, she never was the kind of agent to follow things by the book, and she couldn't count the amount of handlers that almost had her sacked for "communication failures". Still, this message had her a little perplexed. Trigger never sent voice messages, he always was the type of pegasus to just figure out where ever you were and talk to you in person. So then what, Starail thought, could be so important that he had to reach her as soon as possible? Bmmpt! Bmmpt!... Trigger again. As soon as she picked up the phone, Trigger spoke. "Listen to me, Starail. Have you ever noticed suspicious activity surrounding Avian immigration recently?" A question so out of left field Starail couldn't even formulate a thought before Trigger continuned. "I've been getting reports, hundreds of them. All about potential Kingbirds going over the breach and arriving here as "tourists". Just recently AIS detained one of the assholes, bird didn't speak a single lick of English. Autopsy revealed he had a device embedded into his arm, techies don't exactly know what it is yet... But they traced several signals coming out of all major voting megacities in relation to that device. Oh, yea. And his tattoos matched that of Aviceynian Kings Guards."\n\nStarail winced at the implication of what that could mean, a terror attack to scare away voters? Something to sabotage the voting machines? It can't be a coincidence that this was happening as the final critical months of the presidental election were approaching. It just couldn't. Starail gently slammed her desk with her hoof, ensuring Trigger couldn't hear her frustration. She knew Arcadia wouldn't survive a scandal as big as this. "God dammit. Listen, get us on a conference with Monarch. I need AESA and AIS on this thing now! Any Avian you see I want them monitored and searched without warrant, doesn't matter how long they've been here. This election has to go uninterrupted. Do you hear me, Trigger?!""  
 arc.30.a: "Ma'am, yes I do!"

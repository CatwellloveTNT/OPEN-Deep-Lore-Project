# -------------------- EAST HAKISTAN --------------------
 ehaki.1.t: "The HSSF proposes terror attack in West Singhali"
 ehaki.1.d: "The Hakistan State Security Force, or HSSF has proposed a terror attack in the West Singhali province to force the hoof of the illegitimate Hakistani government and force them into a war with us. All they need is your authorization"

 pro.106.t: "Black and Red Tape"
 pro.106.d: "In an undisclosed location that did not exist, A Protean batpony and a Krieg pegasus— who did not meet each other, sat next to a large flat screen TV, which most definitely did not have the plans on how to help the struggling First World Universal Rights Act's supporters displayed on it's screen. If the pegasus was at that location— which he was not, he would have scoffed and initiated conversation with the batpony by saying: "Are you even süre you can get this done properly? What makes you think you wouldn't be execüted on the spot? Protea's not exactly known for its appreciation of our kind.\n\nThe Protean, who did not have toothpaste coloured hair replied in her raspy Protean accent "Look, that's not exactly your problem to be worrying about mate, we're bloody putting our heads on the cutting board 'ere and I need to know you'll provide the support we need to make this work". The pegasus sighed, "It's not that easy, bät. You're asking me to go against our strongest ally in The Cradle. And that's not to mention, what if this thing blows up? What if tomorrow theres an article on Poners talking about us meddling in our ally's government, do you know how bad that'll make the Coalition look?" The batpony knew he had a point, if this did indeed blow up, the entirety of the CHDI would be undermined. Regardless, she knew she had to get him on her side, and so she switched strategies.\n\n"You're speaking as if Protea isn't sitting on a landmine. Do you think it can survive the next major war with 8 million First World ponies being denied service?" She barked, "Ha, forget that! Do you think Protea can survive when those 8 million ponies realize the Second World would treat them better?"\n\nThe Krieger's eyes narrowed, what he just heard was dangerous. Was the situation truly that bad that those ponies would consider turning to the crown? Before he could even formulate a response, the batpony continued "Listen, I'm not- I'm not asking for much here... We just need to be able to operate without our members getting killed or snatched off the streets. Everything else we'll handle. We just need some protection." The pegasus buried his face in his hooves and sighed, what a horrible situation to find oneself in. Either risk Protea having an potential uprising during a major war and losing the Strait of Life, or deploy assets into a CHDI member state and risk undermining the entirety of the CHDI.\n\n"Scheiße... Ok, look. We'll deploy small teams near IATP and SSS outposts at your request. If you feel they have a lead on one of your guys, give us a call, we'll see what we can do". The Protean smiled, "Thats a decision you won't regret. We'll get this done. Trust me".\n\nThat's the conversation that would have happened between those two ponies, but it never happened, because they did not meet each other, and they were never there."
 pro.106.a: "Wow Toothpaste, I didn't expect them to agree!"

 chf.2.d: "todo: explain that the CIS (Chaffian intelligence service) has noticed that protea has increased military presense around the border and that their troops should be at alert for any attack" 
 chf.2.a: "Are they planning something?"
 chf.3.t: "Smoke and Mirrors"
 chf.3.d: "todo: explain that chaffia believes that the increased military buildup is to provoke chaffia into attacking first to give protea causus beli to attack." 
 chf.3.a: "We won't fall for such deception."
 chf.4.t: "Protea Crosses The Border!"
 chf.4.d: "todo: PROTEA ATTACKS GET CREATIVE" 
 chf.4.a: "Get our troops to the border now!"
 chf.5.t: "Protea Forces Us Back!"
 chf.5.d: "todo: explain that protea's attack caught the chaffians so offguard that they had to retreat from the poland heights" 
 chf.5.a: "Send in our diplomats, we weren't ready for this!"
 chf.6.t: "Protea Halted!"
 chf.6.d: "todo: explain that despite the inital shock of the attack, chaffian soldiers managed to bounce back and defend in the poland heights" 
 chf.6.a: "And stay in your place!"
 chf.7.t: "Protea Uses Our Ponies As Shields!"
 chf.7.d: "todo: protea evil" 
 chf.7.a: "Look at what we're fighting against!"
 chf.8.t: "Running From The Reaper"
 chf.8.d: "todo: as protea consolidates its hold on the poland heights, thousands of ponies flee from the proteans " 
 chf.8.a: "Clear out the roads, give them passage!"


 chf.2000.t: "From You, 65 Years Ago" #note that the first skirmish happened in 2028, so this program has been going on for 4 years
 chf.2000.d: "todo: explain that over the past few years chaffia has been funding a program to get the isolatians and other pony families who were thrown out from their homes by the proteans back in 1968 after theY retook the land in 2028, the event focuses on a pony and his family who returns to his family house and finds it totally different, with pictures from a different, human family there and no traces of anything from his parent's home. the older members of his family breaks down as the house they once lived in is totally foreign to them (IN THAT REGARD, YOU MUST DETAIL HOW HIS PARENTS WERE EITHER VERY SENTIMENTAL TO THE HOUSEHOLD, OR OTHERWISE SEE ALOT OF VALUE IN IT)"
 chf.2000.a: "We've made a lot of progress these past few years..."
 chf.2001.t: "Ready, Resolute, Rational"
 chf.2001.d: "todo: as Roselina (i dont have a name for her yet, leader of chaffia) gives a speech about the homebound program, she reminds the ponies that protea is like a rabid dog, and to always be prepared and ready for them to return."
 chf.2001.a: "That's why I keep the strap on me at all times."
 chf.2002.t: "Our Age-old Friend..."
 chf.2002.d: "todo: describe the relationship between chaffia and flaria, how they started as nations, how the current leader of the two nations are literally sisters, and how they fought and lost against the coalition in 1968, and how they beat back protea in 2028."
 chf.2002.t: "Together As One."
 chf.2003.t: "Keep Calm, and Trot On"
 chf.2003.d: "you cheating pieace of shit how did you g et this event?!>!?!?!??!?!??!!?"
 chf.2003.a: "bruh"
 chf.2004.t: "A Sister's Plea"
 chf.2004.d: "todo: Roselina desperately contacts her sister in flaria and informs her of the proteans moving into the poland heights, they decide to formalize an alliance together"
 chf.2004.a: "Thank you sister, we cannot fail..."
 chf.2005.t: "The Twin-Headed Demon Descends"
 chf.2005.d: "todo: after their defeat in poland, chaffia recieves a message from aviceyn, giving them an offer to integrate into the second world"
 chf.2005.a: "To think we'd be humanity's greatest allies had they not treat us so wrong... I'll tell them no myself."
 chf.2006.t: "The Military Industrial Complex"
 chf.2006.d: "todo: after their defeat in poland, Roselina permits a decree to set up chaffia military industrial complex, to the dismay of some civilians"
 chf.2006.a: "I know this strays from our ideals, but its necessary..."
 chf.2007.t: "The Star Economy of the Third World"
 chf.2007.d: "todo: Roselina calls her sister over to Chaffia to see it's industrial progress for herself"
 chf.2007.a: "Look, sister! Industrial disticts as far as the eye can see! W-with NO workplace injuries!"
 chf.2008.t: "Flesh and Steel"
 chf.2008.d: "todo: Roselina convenes with an army marshall (you'll have to make this a character with a position in chaffia, more than likely Roselina's personal friend and chaffia's prime army marshall) and talks over the loss to protea, they conclude that if chaffia is to survive, it must mechanize, and quickly."
 chf.2008.a: "Well then Blueberry, let's get started."
 chf.2009.t: "The Blank Check"
 chf.2009.d: "todo: Blueberry meets with Roselina and exicitedly explains the plan to create the III corps to her, Roselina pokes holes in the plan and points out the potential cost of creating such a corps. blueberry then gets sheepish, tucks his tail between his legs, and practically begs for a blank check to make the corps a reality. Roselina, against her better judgement, gives him the blank check."
 chf.2009.a: "Oh, one last thing Roselina... The uhh... the cost..."
 chf.2010.t: "Not An Inch of Ground..."
 chf.2010.d: "todo: Roselina meets with blueberry and discusses the loss in protea, while blueberry tries to convince her to opt into a more offensive, mechanized force, she decides to push the army into a more infantry focused, defensive posture. While disappointed, blueberry moves to create plans to defensiveize the army"
 chf.2010.a: "Never Again..."
 chf.2011.t: "Just as Good as Them..."
 chf.2011.d: "todo: Popula meets with Roselina and they conduct a thorough review of the reformed Chaffian army, by the end of the popula, blueberry and Roselina speak and popula is very impressed, but worried that it may not be enough to beat the puppet of the first world."
 chf.2011.a: "How could we ever lose with an army like this, sister!?"
 chf.2012.t: "The Death of Ego"
 chf.2012.d: "todo: Roselina meets with Popula and they discuss the air force and future air wars chaffia will get involved in, popula recommends to eat her pride and adopt a more first world air war doctrine."
 chf.2012.a: "Anything to survive, right sister?"
 chf.2013.t: "Dethroning The King...?"
 chf.2013.d: "todo: Roselina recieves a message from La Brea, asking her to meet in the tristan megacity, after a little tour of the megacity, la brea gets to business. he reveals the reason for requesting a meeting with Roselina is to gather allies to fight back against the coalition, and that La Brea is willing to support her in her fight. When Roselina states everything is already taken care of, La Brea mentions the Chaffian airforce, and says with a little Tristan help and courage, they can and should try to match the humans in the air and beat them."
 chf.2013.a: "I'll... think about it..."
 chf.2014.t: "...In Both Their Kingdoms"
 chf.2014.d: "todo: Roselina excitedly calls popula over to review the reformed airforce of chaffia, popula is impressed, she is so impressed in fact, that she takes one of the fighters for her personal use."
 chf.2014.a: "She can just do that?!"
 chf.2015.t: "The Final Checkups"
 chf.2016.t: "Are You Ready, Flaria?"
 chf.2017.t: "Are You Ready, Chaffia?"
 chf.2018.t: "Are We Ready?"
 chf.2019.t: "Ready Or Not..."
 chf.2020.t: "...Here We Come"
 chf.2021.t: "Protea Bests Us Once Again"
 chf.2021.d: "todo: protea defeats chaffia in the third skirmish"
 chf.2021.a: "Not again... Not again!"
 chf.2022.t: "The Second Great Retreat"
 chf.2022.d: "todo: hundreds of thousands, if not millions of ponies run away from their homes as protea reimplements the protean system and begins deploying death squads into the liberated terrirtories, devola sits in her parliment whatever the hell capital building, and weeps as she recounts how the failures of the past led to what happened today"
 chf.2022.a: "Look at what our failures have done... It does nothing but break my heart."



# -------------------- AVICEYN --------------------
avi.1.t: "Aviceyn - The Pax Avianica"
avi.1.d: "bro im too lazy to make the todo"
avi.1.a: "We will do what we must... to remain in bliss."
avi.2.t: "An Empress In Need..."
avi.2.d: "todo: after protea takes the poland heights, aviceyn sends a formal invite to chaffia, giving them a stepping stone to become an integral part of aviceyn's second world. "
avi.2.a: "An opportunity so good, no... pony... can refuse!"
avi.3.t: "The Queen Promptly Rejects"
avi.3.d: "todo: Within the same day of the invite being sent chaffia's way, Roselina rejects the offering with stern wording. have this be in like a letter/voice message made by Roselina and its as if the kings were listening to/reading it"
avi.3.a: "Fine then, be eaten by Humanity. I don't care!"



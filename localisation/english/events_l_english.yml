 chf_desperation_mechanic_starts_tt:0 "From here on out, the §YDesperation§W mechanic will become active.\n\nAs Chaffia's geopolitical situation §GImproves§W or §RWorsens§W, Roselina will become less or more desperate to save Chaffia.\n\n§RIf Roselina's desperation overwhelms her judgement, she may do things she never thought she had the stomach to do before...§W\n\n§YRoselina's Desperation Begins at 10\nChaffia's Existential Threat Status begins at Minor§W\n\n"

# -------------------- COALITION STATES --------------------
 col.1.t: "The Coalition States - The home of Humanity"
 col.1.d: "todo: talk about their brief history, demographics, languages, and their relationship with the other species in the verse"
 col.1.a: "Glory... to Mankind."
 col.2.t: "To cut a head off the hydra."
 col.2.d: "todo: describe the situation leading up to flashpoint arcadius, about how one of the royal brothers will be visiting triste and how its the coalition's once in a lifetime chance to assassinate him."
 col.2.a: "Get me a line with the admiral of the Arcadius strike group NOW!"
 col.3.t: "Setting sail"
 col.3.d: "todo:describe the situation on the arcadius itself, introduce hawks and essenitally run through the events of the flashpoint arcadius comic up until the end of the briefing. end the desc with the pilot asking if this will lead the world to war"
 col.3.a: "For a prize so big, no consequence is too much."
 col.4.t: "On radar"
 col.4.d: "todo: get more indivdual with hawks and faye, this event needs to make the reader care for their relationship and for hawks in particular, tho note you should of been doing that in the prior events aswell. for the scenario describe what is occuring after the briefing, make the tension known and have it lead up to hawks and faye taking off on the CATs"
 col.4.a: "The fate of the world was now in her hands."
 col.5.t: "STT"
 col.5.d: "todo: skip over the part where they kill 2 other planes and get past AA, thats what the comic is for. Hawks has air force 1 (lol) locked in STT, the event ends with her holding the pickle button"
 col.5.a: "'This is Hawks, sending one off the rails!'"
 col.6.t: "HPRF"
 col.6.d: "todo: hawks fires off her missile at 60 nautical miles, with 74 seconds of HPRF, however as the counter ticks down, she is shot at by extremely deadly SAMs. end the event with the player choosing her next action"
 col.6.a: "She breaks into a 9g split S, letting the missile go and going cold."
 col.6.b: "She stays the course"
 col.7.t: "Outlaws"
 col.7.d: "todo: hawks breaks off the fight and her missile goes dumb, she dives to 1000 feet and plunges the missile into the ground. shortly after her RWR shows her getting spiked by an unknown radar contact."
 col.7.a: "A dogfight that will define an era was about to begin."
 col.8.t: "A Necessary Sacrifice."
 col.8.d: "todo: hawks stays the course and she is shot down by the SAM, her plane falls from the sky as it violently rips apart until it hits the group, hawks dies in the explosion. focus on faye and his reaction to his childhood best friend dying."
 col.8.a: "As much as he begged and hoped, he never saw a chute."
 col.9.t: "The 2032 Annual Situation Assessment"
 col.9.d: "todo: talk about political leaders and military leaders meeting up to discuss the future of the nation"
 col.9.a: "Heres to a great year for humanity."
 col.10.t: "The Situation at Home"
 col.10.d: "todo: talk about the coalition states, the nations that make up the states, their specalities, their greivences with the state government, and past tensions in the east"
 col.10.a: "Maybe we should focus on ourselves..."
 col.11.t: "Our Allies Abroad"
 col.11.d: "todo: talk about the coalition's allies, talk about the relationship between arcadia and the coalition, and the coalition's relationship to the other members of the CHDI"
 col.11.a: "Y'know, the Celestial Eclipse excercise is coming up."
 col.12.t: "Our Geopolitical Enemies"
 col.12.d: "todo: talk about the enemies of the coalition, about aviceyn and its moves against the states, and mention the flashpoint arcadius incident and YOU MUST stress that the coalition is getting scared and nervous about triste aligning with the second world and YOU MUST write it so that it makes sense why the coalition invades when they do"
 col.12.a: "That last part... not good."
 col.13.t: "A Proud Family Tradition"
 col.13.d: "todo: this event takes place in the coalition states, its main character is a human going to arcadia to visit his pony friend. YOU MUST STRESS THAT THIS IS A THING HUMANS FROM THE COALITION STATES DO EVERY YEAR. tbh idk what you can do with this event, make sure to show their bond with each other"
 col.13.a: "The airport that day was packed..."
 col.14.t: "My Bestie Across The Pond."
 col.14.d: "todo: this event takes place in arcadia, the main character of the event is a pony that is friends with a human from the coalition states, and that human comes to visit arcadia. speak on their experiences and how they bond with each other, and end the event with the human leaving back to the coalition"
 col.14.a: "'You're gonna make me go through post-human depression!'"
 col.15.t: "How Do I hold a Gun With Hooves?"
 col.15.d: "todo: take an overview like perspective with this one. talk about the history of the celestial Eclipse excercise, about how its been a thing for decades, and how even civilians are allowed in on the excercise. YOU MUST SUBTLY MAKE IT SEEM LIKE ARCADIA IS TAKING THIS AS A JOKE. you can also talk about the characters interacting with each other."
 col.15.a: "How exciting!"
 col.16.t: "A Look in the Mirror"
 col.16.d: "todo: speak broader on the history of the coalition states, note the quirks of each state and trinidad's relationship between all of them."
 col.16.a: "One minus ten leaves naught, after all."
 col.17.t: "From Amour, with love."
 col.17.d: "todo: the main character of this event is a human of westarchian descent, he speaks english and krieg. he meets with a group of humans, one of them being from amour. the group, which consist of humans from across the coalition take him in and they do shit together. but the mc is unable to understand the amouran due to language barriers. the other members of the group translate for him and they all laugh by the end."
 col.17.a: "He would now go through life with a newfound fondness for Amourians"
 col.18.t: "Old Wounds"
 col.18.d: "todo: talk about the tense history between the eastern and western states of the coalition, speak about the differences between the east and west, Amour's cultural dominance of the east and how the coalition states almost went into a civil war in the past due to the cultural overroding and neglect of the eastern states. additionally talk about how relations are today."
 col.18.a: "Into the future, together."
 col.19.t: "Exercise Celestial Eclipse"
 col.19.d: "todo: speak on what occurred during the large scale excercise, talk about the ground actions, air and naval actions, talk about the NCOS from both sides meeting and chatting it up and working together, speak on the pilots meeting each other and the military leaders working with each other."
 col.19.a: "A good showing, as always."
 col.20.t: "The Annual CHDI defense summit"
 col.20.d: "todo: introduce the countries of the CHDI and intdicate that each of them will take the stand and speak on their nation's needs and Geopolitical situation."
 col.20.a: "We'll take the stage first."
 col.21.t: "Our Geopolitical Situation"
 col.21.d: "todo: explain the geopolitical situation of the coalition states to the council, you can reference the other shit you did lol"
 col.21.a: "And next up... Ravenhaus!"
 col.22.t: "A Raven's Plight"
 col.22.d: "todo: explain the geopolitical situation of Ravenhaus, explain that they are in a stable position however tensions are flaring up in Naebbirac. elaborate on their need for resources to build and maintain their green water fleet and how they request a carrier strike group to be deployed into Naebbirac to support them."
 col.22.a: "We'll think about it. Next up... Tarmarizu!"
 col.23.t: "Nothing Ever Happens"
 col.23.d: "todo: explain the geopolitical situation of Tarmarizu, explain how they want to maintain the status quo and has taken a stance to reject war and conflict, however they claim to remain resolute in the defensive alliance"
 col.23.a: "Suspiciously Third World. Next up... Protea!"
 col.24.t: "So Far From God"
 col.24.d: "todo: explain the geopolitical situation of Protea, indicate how they are being surrounded on their borders by hostile nations wanting to wipe humanity out of the cralde, explain that the protean army and air force is in need of more equipment, explain that the proteans want a Coalition armed force deployed to the country for protection and explain that Protea believes Tarmarizu is disgracing the alliance."
 col.24.a: "We'll have to give them a hand... Next up... Our Arctic Territory!"
 col.25.t: "A Winter Vacation"
 col.25.d: "todo: explain the geopolitical situation of the coalition arctic terriroty, explain that their radars sensers have picked up little activity and how that is cobberated by their pegasus scouts in the air as well as spy planes. explain that the arctics urges protea to increase protection of the Yuji canal as it serves as their primary supply lifeline and how they would like to host a winter training exercise."
 col.25.a: "Looks like we got those damn birds boxed in."
 col.26.t: "A Forgotten Someone"
 col.26.d: "todo: explain the anger that new germany expressed to the coalition states in private for not being allowed into the CHDI summit."
 col.26.a: "Lil bud, you're literally two provinces. Maybe when you get bigger."
 col.27.t: "South Srakin Calls For Aid!"
 col.27.d: "todo: give a brief summary of the history behind the two srakins and the coalition's backing of the south and their promise to support them"
 col.27.a: "When the Second World rears its head... Humanity answers the call."
 col.27.b: "Humanity does not associate with Aviankind."


 pro.2000.t: "Chaffia Crosses The Border!"
 pro.2000.d: "PROTEA DAILY - BREAKING NEWS!\n\nAt[GetDateText], Numerous ground reports have confirmed the presense of Chaffian Armoured units crossing the border between Protea and the Chaffian state, which recently annexed it's neighbour Flaria.\n\nThe Chaffian armoured spearhead rapidly overwhelmed many of the guards and military police stationed at the border, and many speculate the Chaffians are attempting to create a buffer zone between Protea and it's capital city Sapphoro. Protean Army Generals have been on record saying that they are planning to mount a counter attack. More news at 10." 
 pro.2000.a: "Who do they think they are?!"
 pro.2001.t: "Chaffia Launches A Preemptive Nuclear Strike Against Our Critical Regions!"
 pro.2001.d: "PROTEA DAILY - BREAKING NEWS!\n\nAt[GetDateText], There have been several confirmed reports of nuclear warheads being used against our people, shocking and graphic drone footage have surfaced showing the crators of the nuclear impact sites and hundreds of thousands, if not millions of deaths have been estimated by these nuclear strikes.\n\nIn what they now proclaim to be the death of Protea, Chaffia has decleared an illegal war against our nation and has sentenced our people to death by bullet. We are yet to hear from Prime Minister Downs, but some have begun to assume that he was eliminated in one of the six nuclear strikes that struck the country today. More news at 10." 
 pro.2001.a: "WHAT?!"
 pro.2002.t: "Government Heads Decapitated!"
 pro.2002.d: "In what can only be described as a total disaster, the nuking of Austral has seemingly left us without a government, many of our poltiical heads, including the prime minister as well as his advisors as well as a majority of the parlimental staff and members have been eliminated!" 
 pro.2002.a: "WHAT?!?!"
 pro.2003.t: "Our Military Is Leaderless!"
 pro.2003.d: "As if the situation couldn't get any worse, reports are coming in that the nuking in Ausborne has eliminated most of the joint chiefs. In addition to that, it seems like a majority of our 3 and 4 star generals have been eliminated aswell, and if that wasn't already too much, a large amount of our C5ISR assets were eliminated by proxy due to the risk of nuclear radiation in the surrounding areas." 
 pro.2003.a: "WHAT?!?!?!"
 pro.2004.t: "Chaos Forms Across The Front!"
 pro.2004.d: "Due to the lack of leadership and coordination amoung the remaining commanders on the field, our troops have become largely disorganized. Many of our divisions have opted into siezing strategic positions and committing to a defense in depth, retreating across the country as they wait for centralized command to reform itself." 
 pro.2004.a: "WHAT?!?!?!"
 pro.2005.t: "Our Saving Grace"
 pro.2005.d: "Despite the devasting first strike the Chaffians have dealt us, not all hope is lost. The recently revitalized Protean Air Force and a majority of it's leadership is still intact, and have made contact with what remains of central command. They plan to help the troops by laying down on call CAS and OCA wherever required, they are our only saving grace." 
 pro.2005.a: "OK MAN STOP IT WITH THESE EVENTS"




 chf_second_great_retreat_minigame_start_tt:0 "While we were able to deal with the influx of fleeing ponies after our loss in the second skirmish, the scale of what is now being called the "Second Great Retreat" has proven far too much for us to handle.\n\nWith over 2 million ponies successfully fleeing from the occupied territories, we've found ourselves in a situation where we don't have the capacity to help so many ponies at once. Despite this, Roselina has decided to activate the Open Door decree, attempting to provide a home to the displaced ponies.\n\n§RWe know Protea will invade again, if we are unable to deal with this crisis before then, the results are projected to be catestrophic§W.\n\n§YThe "Open Door" Minigame has activated, check your descisions§W."

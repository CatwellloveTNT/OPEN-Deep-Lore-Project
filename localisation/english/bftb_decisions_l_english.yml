 air_war_loss:0 "Our population expects us to win this air war without much trouble. If we fail to do so however, the consequences may be dire"
 chf_showdown_survive:0 "§RSURVIVE§W"
 more_planes:0 "We will send a request to the Coalition States for an additional §G+50 Strike Aircraft§W"

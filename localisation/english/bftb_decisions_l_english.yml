l_english: 
 CLS_solaris_minigame:0 "SOLARIS"
 CLS_solaris_minigame_desc:0 "Having ratified the DONA Treaty in 2001, the Coalition States existed for a notable peroid of time as the only one of the Big Three that lacked any form of deterrence against nuclear weapons, this lack of nuclear deterrence led head engineers and scientists within the Coalition to devise Solaris in 2019. \n\nSolaris is an array of geolocked satellites which exist in high orbit above the Coaltion States and its allied nations. In the event of a nuclear showdown between any of the Big Three, Solaris satellites would shoot high intensity directed energy towards any hostile nuclear launch vessels as they entered the atmosphere and disable the nuclear weapons mid flight. At least... That was the inital concept. \n\nIn 2032 Solaris is a well known factor when it comes to geopolitical interactions with the Coalition States. Nations like Arcadia have even given up large swaths of land just to be protected by Solaris and Coalition allies with Solaris protection are in a way always walking on thin ice. On the other hand nations like Aviceyn are also well aware of Solaris's capabilities and they constantly probe the software of Solaris to find cracks in it's armour. §RIf Aviceyn or their allies ever manage hack into Solaris and hinder its capabilities significantly enough, our way of life as we know it will be over.§R"
 simple_category_with_picture_desc:0 "Just some text to show the picutre of the category."
 PRO_showdown:0 "Operation Midnight Fury"
 PRO_showdown_desc:0 "Operation Midnight Fury consists of two parts: Phase 1 is a high intensity SEAD/DEAD campaign. In order to move onto the next phase, we MUST destroy either all of their radar emitters or their SAM sites. We only need to eliminate one. \n\nPhase 2 is a terror bombing campaign, we will have to totally destroy five of the seven target regions of the Countermeasures Alliance to proclaim victory... Now, you remember your CHDI air operation abbreviations, right?\n\nOUR ACTIONS:\nHAVCAP - Counters enemy INTERCEPT missions against our AWACS/EW assets. \n\nTARCAP - Undoes enemy BARCAP missions. \n\nSTRIKE - Low risk strike mission against dual use assets. \n\nOCA STRIKE - Medium risk strike mission against military assets. \n\nDEEP STRIKE - High risk strike mission against critical assets \n\nEWS/ESJ - Used proactively, reduces the losses taken after a STRIKE mission and enemy SWEEPS.\n\nENEMY ACTIONS:\nBARCAP - Prevents us from striking a region. \n\nINTERCEPT (AWACS) - A direct attack against our AWACS, can be countered with HAVCAP.\n\nINTERCEPT (EWA) - A direct attack against our electrionic warfare assets, can be countered with HAVCAP. \n\nSWEEP - Enemy will hunt specifically for our strike aircraft, inflicts varying levels of losses.\n---------------------------------------------------------------------------------------------------------------------\n\nStrike Aircraft in AO: [?global.num_of_strike_aircraft]\n\nAWACS Aircraft in AO: [?global.num_of_awacs]\n\nElectrionic Warfare Aircraft in AO: [?global.num_of_ewa]\n\n--------------------------------------------------------------------------------------------------------------------- Active SAM Sites: [?global.num_of_sams]\n\nActive Radar Emitters: [?global.num_of_radars]\n\n Region1 Destruction: [?global.destruction_r1]%\n Region2 Destruction: [?global.destruction_r2]%\n Region3 Destruction: [?global.destruction_r3]%\n Region4 Destruction: [?global.destruction_r4]%\n Region5 Destruction: [?global.destruction_r5]%\n Region6 Destruction: [?global.destruction_r6]%\n Region7 Destruction: [?global.destruction_r7]%\n\n TOTAL DESTROYED REGIONS: [?global.total_destroyed_regions]  "
 harms:0 "We will send our aircraft out with ARMS on every pylon. This improves DEAD effectiveness, but our aircraft will be powerless if hostile fighters show up."
 winders:0 "( THIS IS SELECTED BY DEFAULT ) \nWe will send our aircraft out with two infrared missiles for self defense, this reduces DEAD effectiveness but ensures our aircraft can handle themselves if hostile aircraft show up."
 weazeling_it:0 "Inflicts losses primarily to SAMS while inflicting minor losses to radars."
 emitters:0 "Inflicts losses primarily to radars while inflicting minor losses to SAMS."
 CHF_showdown_desc:0 "Operation Midnight Fury consists of two parts: Phase 1 is a high intensity SEAD/DEAD campaign. In order to move onto the next phase, we MUST destroy either all of their radar emitters or their SAM sites. We only need to eliminate one. \n\nPhase 2 is a terror bombing campaign, we will have to totally destroy five of the seven target regions of the Countermeasures Alliance to proclaim victory... Now, you remember your CHDI air operation abbreviations, right?\n\nOUR ACTIONS:\nHAVCAP - Counters enemy INTERCEPT missions against our AWACS/EW assets. \n\nTARCAP - Undoes enemy BARCAP missions. \n\nSTRIKE - Low risk strike mission against dual use assets. \n\nOCA STRIKE - Medium risk strike mission against military assets. \n\nDEEP STRIKE - High risk strike mission against critical assets \n\nEWS/ESJ - Used proactively, reduces the losses taken after a STRIKE mission and enemy SWEEPS.\n\nENEMY ACTIONS:\nBARCAP - Prevents us from striking a region. \n\nINTERCEPT (AWACS) - A direct attack against our AWACS, can be countered with HAVCAP.\n\nINTERCEPT (EWA) - A direct attack against our electrionic warfare assets, can be countered with HAVCAP. \n\nSWEEP - Enemy will hunt specifically for our combat aircraft, undoes TARCAP effects.\n---------------------------------------------------------------------------------------------------------------------\n\nStrike Aircraft in AO: [?global.num_of_strike_aircraft]\n\nAWACS Aircraft in AO: [?global.num_of_awacs]\n\nElectrionic Warfare Aircraft in AO: [?global.num_of_ewa]\n\n--------------------------------------------------------------------------------------------------------------------- Active SAM Sites: [?global.num_of_sams]\n\nActive Radar Emitters: [?global.num_of_radars]\n\n Region1 Destruction: [?global.destruction_r1]%\n Region2 Destruction: [?global.destruction_r2]%\n Region3 Destruction: [?global.destruction_r3]%\n Region4 Destruction: [?global.destruction_r4]%\n Region5 Destruction: [?global.destruction_r
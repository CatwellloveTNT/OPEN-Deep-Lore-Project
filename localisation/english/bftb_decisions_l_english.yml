 PRO_the_protean_system:0 "The Protean System Reform"
 PRO_the_protean_system_desc:0 "[protean_system_reform_path] [protean_system_hardline_path]"
 protean_system_reform:0 "The Protean System, also known as the Third World Pony System or the Outsider Clause, is a series of laws that dictate how ponies should be treated within Protea.\n\nPonies without valid and verifiable documents that prove they originate from a First World country will find themselves either executed on the spot, or sent into indefinite slavery for the Protean war effort. Ponies from First World nations or Protea itself will find themselves— while not being shot immediately, in a very disadvantagous situation.\n\nThese First World ponies are subject to being second class citizens, they find themselves segregated from larger Protean society and are discriminated against whenever possible. Many ponies can cite first hand accounts of them or their friends being treated with extreme prejudice, being denied food and water, being evicted without notice and even having their homes be sold off to human families without their permission.\n\nMany Protean ponies feel frustrated. They feel hopeless. They see how humanity treat other ponies in Arcadia and the Coalition. They see the lives the rest of their species are living. They see the lives they could of had... If only, things were a little different.\n\nThis growing frustration is what birth life to the First World Universal Rights Act. If ratified, this act will provide First World ponies with the same rights, freedoms and protections as humans living within Protea. Support for the act is low, as the SSS and IATP have tried their hardest to suppress, execute or deport the supporters of the act, but even still rare acts of protest can be noticed across the country.\n\nAfter the recent existential wars that forced Protea to integrate First World ponies more and more into broader society, the main promoters of the act believe now might be the only opportunity to get the act into parliment, lest they curse their kind to eternal damnation.\n\n---------------------------------------------------------------------------------------------------------------------\n\n[protean_system_tfi_selected][protean_system_pfh_selected][protean_system_iatp_selected][protean_system_sss_selected][protean_system_nothing_selected][protean_system_sss_active]\n---------------------------------------------------------------------------------------------------------------------\n\nPFH Reform %: [?pfh_reform_percentage]%\nIATP Deconstruction %: [?iatp_influence_percentage]%\nSSS Policy Reform %: [?sss_reform_percentage]%\n\nPopulation % That Supports The Act: [?population_that_supports_reform]%\nSuspicion of Trinidadian Foreign Intelligence %: [?tfi_suspicion]%"
 protean_system_hardline:0 "test"
 protean_system_tfi_selected_loc:0 "                           TRINIDADIAN FOREIGN INTELLIGENCE SELECTED\n\nWhile we attempt to gain support for the act, the IATP and SSS will attempt to stop us. Luckily, Valkyrie and Phoenix have managed to contact members of Trinidadian Foreign Intelligence who are more than willing to provide us with support. They claim, however, that TFI's support must remain undetected. After all, an international scandal between CHDI member intelligence agenices is the last thing the First World needs right now.\n\n§RTRINIDADIAN FOREIGN INTELLIGENCE WILL BE A MAJOR BOON FOR THE ACT, BUT IF SUSPICION REACHES 60%, THEY WILL BACK OUT PERMANENTLY!§W"
 protean_system_pfh_selected_loc:0 "                                       PROTEA FOR HUMANITY SELECTED\n\nFormed in 1964 directly after the formation of Protea, the Protea For Humanity party or PFH have been the dominant political party within Protea for the past 40 years, winning 10 consective elections and on track to win the next. Consisting primarily of humans with little to no pony representation, the party has stood by the current Protean System since it was instated. Fleetfeather states he knows members of the parliment sympathetic to our cause, [protean_system_pfh_fleetfeather_part_red][protean_system_pfh_fleetfeather_part_green]"
 protean_system_fleetfeather_part_red_loc:0 "§Rbut he can't do much with the IATP deporting anyone willing to speak out against the Protean System.§W"
 protean_system_fleetfeather_part_green_loc:0 "§Gand with the IATP dismantled, they can start making reforms.§W"
 protean_system_iatp_selected_loc:0 "                        INSTITUTE AGAINST THIRD WORLD PONIES SELECTED\n\nThe IATP, or Institute Against Third World Ponies, is a law enforcement agency formed under the basis that Protea should be free of the people who wish to see it perish. One could say at one point the IATP was a force of good in Protea, keeping the humans and ponies of the First World safe, but those times are long since gone. The IATP is rotten and corrupt to it's core. They deport or kill anyone who seeks to see proper pony upliftment, and radically oppose change within Protea. §RThey must be brought down if we are to succeed.§W"
 protean_system_sss_selected_loc:0 "                                          STATE SECURITY SERVICE SELECTED\n\nThe State Security Service, or SSS is Protea's tier one intelligence agency, much like the Coalition's TFI or Arcadia's AESA, they act to serve Protea's geopolitical interests abroad. In a rare show of pony acceptance, the SSS exists as the only Institution within Protea that generally accepts First World ponies, valuing them for the versatility and their ability to easily capture people's hearts with their cuteness. Valkyrie and Phoenix both claim that they have enough pull within the SSS to get some of the policy makers to become sympathetic to our cause."
 iatp_raid_tt:0 "§RThe IATP will conduct a raid on our supporters...§W"
 iatp_undermine:0 "We will run a campaign to undermine the IATP.\n\n§GWill have a minor effect on IATP Influence§W"
 iatp_assassinate_leader_tt:0 "We will coordinate with Trinidadian Foreign Intelligence to assassinate a IATP leader.\n\n§GWill have a moderate effect on IATP Influence.§W\n\n§YThe government will suspect foreign interference.\n\n§RThere is a 20% chance this action will backfire and create a martyr for the IATP!§W"
 iatp_intimidate:0 "We will send some of our supporters who are also members of the SSS to intimidate the IATP on their raids.\n\n§GWill have a minor effect on IATP Influence§W"
 protean_system_nothing_selected_loc:0 "Click on one of the agencies to interact with them."
 sss_sway_tt:0 "We will send in Phoenix to charm and sway some of the lower ranked agents in the SSS.\n\n§GWill have a minor effect on SSS Policy Reform.§W"
 sss_threaten_tt:0 "We will send in Valkyrie to ensure those within the SSS who might oppose the movement remain silent and passive.\n\n§GWill have a minor effect on SSS Policy Reform.§W"
 sss_tfi_silencing_tt:0 "We will rely on Trinidadian Foreign Intelligence to dig up blackmail against middle rank members within the SSS who oppose our movement.\n\n§GWill have a moderate effect on SSS Reform Policy.§W\n\n§YThe government will suspect foreign interference.§W"
 sss_tfi_pressure_tt:0 "We will send a request to Trinidadian Foreign Intelligence for them to send a deligation to Protea to convince the SSS to commit to reforms.\n\n§GWill have a major effect on SSS Reform Policy.§W\n\n§YThe government will heavily suspect foreign interference.§W"
 sss_organizing_tt:0 "The SSS are currently organizing personnel to investigate the recent "radical" activity happening within Protea\n\n§YThe SSS does not yet know the extent of our operation, and such we can let them organize without it affecting our movement.§W"
 sss_consulting_tt:0 "The SSS are currently meeting with IATP leaders to gain a better understanding of the situation.\n\n§YThe SSS is still unaware of our operations, so we can let them meet with the IATP without consequence.§W"
 protean_system_sss_active_loc:0 "\n\n\n§RWITH THE SSS ACTIVELY INVESTIGATING AND HUNTING OUR MEMBERS, WE MUST FORCE THEM TO ENACT MAJOR POLICY REFORMS BEFORE THEY SEIZE A MAJORITY OF OUR MOVEMENT'S LEADERS!§W"
 sss_understanding_the_situation_tt:0 "The SSS are reaching a point where they understand what is happening, but not who or what is pushing it.\n\n§YThe SSS may in fact be a threat in the future...§W"
 sss_internal_audit_tt:0 "The SSS are conducting an internal audit as it seems they suspect our "radical" movement may have support within the agency.\n\n§RDo they already suspect Valkyrie and Phoenix to be some of the main advocates behind the act?§W"
 sss_a_small_fish_tt:0 "It seems like the SSS has caught onto Blinklight and are in the act of hunting her down!\n\n§RIf they get her and she speaks, they might figure out how truly deep this rabbit hole goes...§W\n\n§GWE CAN CONTACT TRINIDADIAN FOREIGN INTELLIGENCE TO DELAY THE CAPTURE OF BLINKLIGHT!§W"
 pro_tfi_helps_blinklight:0 "Trinidadian Foreign Intelligence says they can get the SSS off the trail of Blinklight for a couple of weeks.\n\n§RThe SSS will suspect foreign interference.§W"
 sss_tortuting_blinklight_tt:0 "Blinklight has been captured by the SSS and we can only assume she is being held in an undisclosed location, and most likely being tortured.\n\n§RWe can only hope Blinklight can keep her lips tight until the end...§W"
 sss_dead_end_tt:0 "In her final act of resistence, it seems like Blinklight said as little as possible to the SSS.\n\n§GThanks to her actions, we've been given a little bit of breathing room.§W"
 sss_preparing_operation_with_iatp_tt:0 "The SSS are redirecting their efforts to support the IATP.\n\n§GValkyrie claims that, with Blinklight not giving any actionable intel to the SSS, they are somewhat lost on what to do next.§W"
 iatp_funding_sabotaged:0 "Fleetfeather can reach out to some of his contacts to covertly redirect IATP funding.\n\n§GWill have a minor effect on IATP influence.§W\n\n§RThere is a chance the IATP will reach out to some of their members to regain lost funds, nullifying the effect of the redirection!§W"
 sss_plain_clothes_spies:0 "The SSS have started deploying plain clothes spies to infiltrate our movement and intimidate our members!\n\n§RThe SSS will arrest some of our supporters among the public!"
 sss_ramping_up_efforts_loc:0 "The SSS is preparing for a major effort against our operation. \n\n§RWe can only assume the worst...§W"
 sss_a_hit_loc:0 "It seems like the plain clothes agents have managed to catch onto the trail one of our lower ranked members\n\n§RThe SSS are currently hunting Alcatraz!§W\n\n§GWe can reach out to our Trinidadian Foreign Intelligence contacts to delay the capture of Alcatraz.§W"
 sss_torturing_alcatraz_tt:0 "§RThe SSS are torturing Alcatraz for any information on the internal working of our movement, we can only hope he can be as resolute as Blinklight."
 pro_tfi_helps_alcatraz:0 "§GTrinidadian Foreign Intelligence will disrupt the SSS's capture operation on Alcatraz.§W\n\n§RThe SSS will suspect foreign interference!§W"
 sss_alcatraz_cracks_tt:0 "Alcatraz has given the SSS actionable intel on our operations.\n\n§RThis is the beginning of the end, the SSS have us in their sights!§W"
 sss_the_second_audit_tt:0 "§RUsing the intel the SSS got out of Alcatraz, the SSS are conducting a second audit of the agency!§W\n\n§GWe can reach out to our Trinidadian Foreign Intelligence contacts to disrupt the audit of the SSS!§W"
 sss_operation_money_mouth_tt:0 "§RThe SSS are conducting a joint operation with the IATP to root out the supporters of our movement within The Ministry of Finance!§W\n\n§GWe can reach out to our Trinidadian Foreign Intelligence contacts to plant false evidence to delay operation Money Mouth!§W"
 pro_tfi_disrupt_operation_money_mouth:0 "§GTrinidadian Foreign Intelligence will insert agents into the Ministry of Finance and plant false evidence onto members who are not supporters of our act.§W\n\n§RThe SSS will heavily suspect foreign interference!§W"
 sss_preparing_a_major_operation_tt:0 "§RThe SSS are planning a major operation to figure out who is heading our movement.§W"
 sss_the_third_sss_audit_tt:0 "§RThe SSS have reason to believe someone higher up within the SSS is pulling the strings of the act and have decided to conduct a third audit!§W"
 sss_operation_insulation_tt:0 "§RTHE SSS ARE CONDUCTING AN OPERATION TO SEIZE PHOENIX!§W\n\n§GWe can contact Trinidadian Foreign Intelligence to send in agents to escort Phoenix to the Coalition States, preventing her capture.§W"
 sss_operation_banknote_tt:0 "§RTHE SSS ARE CONDUCTING AN OPERATION TO SEIZE FLEETFEATHER!§W\n\n§GWe can contact Trinidadian Foreign Intelligence to send in agents to escort Fleetfeather to the Coalition States, preventing his capture.§W"
 pro_tfi_save_phoenix:0 "§GTrinidadian Foreign Intelligence will escort Phoenix out of Protea. She will still be able to advocate for the act.§W\n\n§RTRINIDADIAN FOREIGN INTELLIGENCE CAN ONLY RESCUE ONE OF THE PRIMARY ADVOCATES OF THE ACT. CHOOSE WHO TO SAVE WISELY!§W"
 pro_tfi_save_fleetfeather:0 "§GTrinidadian Foreign Intelligence will escort Fleetfeather out of Protea. He will still be able to advocate for the act.§W\n\n§RTRINIDADIAN FOREIGN INTELLIGENCE CAN ONLY RESCUE ONE OF THE PRIMARY ADVOCATES OF THE ACT. CHOOSE WHO TO SAVE WISELY!§W"
 sss_operation_toothpaste_tt:0 "§RWith the SSS closing in from every angle, and with her friends either captured, dead, or out of the country, Valkyrie must make a choice to decide her fate...§W"
 pfh_campaign_the_act_tt:0 "We will run an online campaign promoting the First World Universal Rights Act\n\n§GA minor portion of the population will begin to support the act.§W\n\n§YThis will have no effect on PFH reform§W"
 pfh_hijack_feeds_tt:0 "We will coordinate with Trinidadian Foreign Intelligence to hijack the social media feeds of our citizens to bring more positive exposure to the act.\n\n§GA moderate portion of the population will begin to support the act.§W\n\n§YThis will have no effect on PFH reform§W\n\n§RThe government will suspect foreign interference§W"
 pfh_replace_stubborn_electives_tt:0 "We will pressure electives who refuse to support the act to resign.\n\n§GThis will have a minor effect on PFH reform.§W"
 pfh_fund_act_supporters_tt:0 "Fleetfeather said he has the means to fund the supporters of the act.\n\n§GThis will have a moderate effect on PFH reform.§W"
 pfh_idk_tt:0 "idk man.\n\n§GThis will have a moderate effect on PFH reform.§W"
 protean_system_minigame_start:0 "We are currently dealing with the Protean System"
 iatp_defeated:0 "The IATP is no longer a threat"
 pfh_reformed:0 "The Protea for Humanity party has been reformed"
 pro_protean_system_majority_support:0 "Atleast 70% of the population supports the First World Universal Rights Act"
 pfh_an_activist_in_every_street_tt:0 "We will coordinate with our supporters to hold protests and annoucements across Protea.\n\n§GA moderate portion of the population will begin to support the act.§W"

